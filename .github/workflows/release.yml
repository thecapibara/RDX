name: Release RDX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            gstreamer1.0-vaapi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app & create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'RDX v__VERSION__'
          releaseBody: |
            ## RDX v__VERSION__ — Frameless Header, Crisp TMDB Details Backdrop & Player UX Polish

            Cross-platform native desktop streaming client (Linux, Windows, macOS) built with **Rust (Tauri v2)**, **React 19**, **Tailwind CSS v4**, and **HLS.js**, inspired by modern Android TV & Smart TV interfaces with an *Obsidian Crimson* aesthetic.

            ---

            ### 🇺🇦 Що нового у версії __VERSION__:

            - **🪟 Безрамковий кастомний заголовок вікна (Frameless Titlebar & Clean TopBar)**:
              - Прибрано зайву системну панель вікна Windows/OS — кнопки керування вікном (згорнути, розгорнути, закрити) та перетягування інтегровано прямо у верхню панель програми (`TopBar` та екран деталей).
              - Очищено верхню панель від годинника та індикатора дзеркала (усі налаштування дзеркал залишаються доступними через кнопку шестерні).

            - **🖼️ Чіткий широкоформатний TMDB-бекдроп на картці фільму (`MediaDetailsModal`)**:
              - Шапка сторінки фільму/серіалу тепер підтягує якісний широкоформатний фон із TMDB замість розмитого темного постера, із м'яким кінематографічним віньєтуванням без надмірного затемнення.

            - **🎮 Поліпшення інтерфейсу плеєра та пошуку**:
              - Прибрано спливаючі бульбашки `▶ Відтворення` / `⏸ Пауза` при перемиканні відтворення.
              - Клік мишкою по плеєру або кнопці Play при відкритому меню (якість, озвучка, швидкість, субтитри) тепер коректно закриває відкриті випадайки, як у сучасних плеєрах.
              - У вікні пошуку розділено кнопки: замість двох однакових хрестиків тепер є окрема зрозуміла кнопка **«Очистити»** та кнопка закриття (`Esc`).

            ---

            ### 🇬🇧 What's New in v__VERSION__:

            - **🪟 Custom Frameless Window Titlebar & Minimal TopBar**:
              - Removed native OS window titlebars (`decorations: false`) and integrated native-style Minimize / Maximize / Close controls and window drag regions directly into `TopBar` and `MediaDetailsModal`.
              - Decluttered `TopBar` by removing the redundant clock and mirror hostname indicator.

            - **🖼️ Crisp Widescreen TMDB Backdrop in Details View**:
              - `MediaDetailsModal` now fetches widescreen TMDB backdrops (`movie`/`tv` + year disambiguation) with balanced vignette gradients instead of an overly darkened blurred poster.

            - **🎮 Player & Search UX Polish**:
              - Removed intrusive Play/Pause HUD pill overlays on playback toggle.
              - Clicking on the video canvas or Play button while a player dropdown/menu is open now cleanly dismisses open menus first.
              - Replaced duplicate `X` icons in `SearchModal` with an explicit **Clear** button and a **Close (`Esc`)** button.

            ---

            ### 📦 Завантаження та встановлення / Download & Installation

            | Platform | Package | Description |
            | :--- | :--- | :--- |
            | **Windows** | `RDX___VERSION___x64-setup.exe` | Recommended installer for Windows 10 & 11 |
            | **Windows** | `RDX___VERSION___x64_en-US.msi` | Windows Installer package |
            | **Linux (Universal)** | `RDX___VERSION___amd64.AppImage` | Portable binary with bundled GStreamer codecs (Arch, Ubuntu, Fedora, Debian) |
            | **Linux (Debian/Ubuntu)** | `RDX___VERSION___amd64.deb` | Standard package for Ubuntu / Debian / Linux Mint |
            | **Linux (RPM)** | `RDX-__VERSION__-1.x86_64.rpm` | Package for Fedora / openSUSE / RHEL |
            | **macOS** | `RDX___VERSION___aarch64.dmg` | Disk Image for Apple Silicon Mac (M1/M2/M3/M4) |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
