name: Release RDX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app & create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'RDX v__VERSION__'
          releaseBody: |
            ## RDX v__VERSION__ — Custom Multi-Episode & Season Selection, Distro Switcher & Signed Updates

            Cross-platform native desktop streaming client (Linux, Windows, macOS) built with **Rust (Tauri v2)**, **React 19**, **Tailwind CSS v4**, and **HLS.js**, inspired by modern Android TV & Smart TV interfaces with an *Obsidian Crimson* aesthetic.

            ---

            ### 🇺🇦 Що нового у версії __VERSION__:

            - **📥 Гнучкий вибір серій та сезонів у завантажувачі**:
              - Додано новий 4-й режим завантаження: **«Вибіркові серії»** поруч із «1 серія», «Сезон» та «Всі сезони».
              - Зручні **таби сезонів із живим лічильником обраних серій** (наприклад, `Сезон 2 (3)`, `Сезон 3 (2)`).
              - Швидкі дії в один клік: «+ Весь N сезон», «Зняти вибір сезону», «Вибрати всі серії взагалі» та «Очистити вибір».
              - Довільний вибір будь-яких серій з різних сезонів (наприклад, 6–8 серії 2-го сезону + 1–2 серії 3-го сезону) в одну чергу паралельного завантаження.

            - **📦 Інтерактивний вибір формату пакета в модалці оновлення**:
              - У вікні оновлення додано кнопки вибору інсталятора під вашу систему:
                - 📦 **.rpm** (Fedora / RHEL / openSUSE)
                - 📦 **.deb** (Ubuntu / Debian / Linux Mint)
                - ⚡ **AppImage** (Універсальний переносний пакет для Linux)
                - 🪟 **Setup.exe / MSI** (Windows)
                - 🍎 **Disk Image .dmg** (macOS)
              - Додаток автоматично показує точний розмір та завантажує потрібний пакет в один клік.

            - **🔐 Безпечні підписані оновлення**:
              - Налаштовано автоматичну перевірку автентичності та цілісності релізів, що захищає користувачів від підробки файлів оновлення.

            - **🎨 Полірування інтерфейсу**:
              - Оновлено модальне вікно оновлень: прибрано нашарування тексту на 3D логотип у шапці, додано чисте форматування списку змін та вирівняно статусний рядок.

            ---

            ### 🇬🇧 What's New in v__VERSION__:

            - **📥 Custom Multi-Episode & Multi-Season Downloader**:
              - Introduced a 4th download mode: **"Custom Episodes"** alongside "1 Episode", "Season", and "All Seasons".
              - **Season tabs with real-time selection counters** (e.g. `Season 2 (3)`, `Season 3 (2)`).
              - Quick 1-click batch actions: "+ Entire Season N", "Deselect Season", "Select All Episodes", and "Clear Selection".
              - Flexible arbitrary episode selection across multiple seasons (e.g. episodes 6–8 of Season 2 + episodes 1–2 of Season 3) into a single concurrent download queue.

            - **📦 Distro & Package Format Switcher in Update Modal**:
              - Direct 1-click installer selector chips right inside the update dialog:
                - 📦 **.rpm** (Fedora / RHEL / openSUSE)
                - 📦 **.deb** (Ubuntu / Debian / Linux Mint)
                - ⚡ **AppImage** (Universal standalone Linux binary)
                - 🪟 **Setup.exe / MSI** (Windows Installer)
                - 🍎 **Disk Image .dmg** (macOS Apple Silicon)
              - Displays accurate asset size and triggers immediate direct package download.

            - **🔐 Secure Verified Updates**:
              - Automated cryptographic verification ensuring update binaries are authentic and protected against tampering.

            - **🎨 UI/UX Polish**:
              - Redesigned update modal header, eliminating text collision with banner artwork, formatted changelog bullets, and streamlined settings status.

            ---

            ### 📦 Завантаження та встановлення / Download & Installation

            | Platform | Package | Description |
            | :--- | :--- | :--- |
            | **Windows** | `RDX___VERSION___x64-setup.exe` | Recommended installer for Windows 10 & 11 |
            | **Windows** | `RDX___VERSION___x64_en-US.msi` | Windows Installer package |
            | **Linux (Universal)** | `RDX___VERSION___amd64.AppImage` | Portable binary with bundled GStreamer codecs (Arch, Ubuntu, Fedora, Debian) |
            | **Linux (Debian/Ubuntu)** | `RDX___VERSION___amd64.deb` | Standard package for Ubuntu / Debian / Linux Mint |
            | **Linux (RPM)** | `RDX-__VERSION__-1.x86_64.rpm` | Package for Fedora / openSUSE / RHEL |
            | **macOS** | `RDX___VERSION___aarch64.dmg` | Disk Image for Apple Silicon Mac (M1/M2/M3/M4) |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
