name: Release RDX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            gstreamer1.0-vaapi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app & create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'RDX v__VERSION__'
          releaseBody: |
            ## RDX v__VERSION__ — Silent In-App OTA Updates, Smart TMDB Backdrops & Codecs Hardening

            Cross-platform native desktop streaming client (Linux, Windows, macOS) built with **Rust (Tauri v2)**, **React 19**, **Tailwind CSS v4**, and **HLS.js**, inspired by modern Android TV & Smart TV interfaces with an *Obsidian Crimson* aesthetic.

            ---

            ### 🇺🇦 Що нового у версії __VERSION__:

            - **⚡ Повноцінне тихе In-App автооновлення (Silent OTA Updater & Progress Bar)**:
              - Реалізовано безшовне автооновлення через офіційний `tauri-plugin-updater` із підписом Minisign.
              - Додаток завантажує оновлення прямо у вікні оновлень з плавним прогрес-баром (`0% → 100%`, швидкість та розмір у MB) та виконує оновлення без відкриття стороннього браузера чи діалогів файлової системи.
              - Кнопка швидкого перезапуску («Перезапустити зараз») для миттєвого переходу на нову версію.

            - **🖼️ Розумний алгоритм фонів TMDB (Smart Backdrop Disambiguation)**:
              - Бекдропи тепер точно підбираються за типом контенту (`movie` або `tv`), усуваючи показ шпалер серіалів для однойменних фільмів.
              - Додано перевірку року випуску (різниця у роках суворо штрафується) та підтримку розбиття складених назв (`orig_title`) через `/`.

            - **🐧 Стабільні кодеки Linux AppImage (Host GStreamer Codecs)**:
              - Вимкнено конфліктну ізоляцію `bundleMediaFramework` в AppImage для прямої роботи з системними кодеками (H.264/AAC) на Linux Mint, Ubuntu, Fedora та Arch.

            - **🎬 Відновлення прогресу фільмів із картки каталогу**:
              - Виправлено проблему, коли фільм починався з `0:00` при відкритті через модалку деталей (`MediaDetailsModal`).

            ---

            ### 🇬🇧 What's New in v__VERSION__:

            - **⚡ True Silent In-App OTA Updates (Tauri Plugin Updater & Progress Bar)**:
              - Seamless cryptographic in-app self-updates powered by `tauri-plugin-updater` and Minisign verification.
              - Real-time download progress bar (`0% → 100%`, downloaded MBs) and instant one-click restart without browser redirections.

            - **🖼️ Smart TMDB Backdrop Disambiguation**:
              - Search accurately discriminates between `movie` and `tv` media types, preventing TV series backdrops from displaying on same-named movies.
              - Strict release-year matching bonus/penalty and multi-title parsing for slashed original titles.

            - **🐧 Linux AppImage Host Codecs**:
              - Native unbundled GStreamer playback integration across all Linux distributions.

            ---

            ### 📦 Завантаження та встановлення / Download & Installation

            | Platform | Package | Description |
            | :--- | :--- | :--- |
            | **Windows** | `RDX___VERSION___x64-setup.exe` | Recommended installer for Windows 10 & 11 |
            | **Windows** | `RDX___VERSION___x64_en-US.msi` | Windows Installer package |
            | **Linux (Universal)** | `RDX___VERSION___amd64.AppImage` | Portable binary with bundled GStreamer codecs (Arch, Ubuntu, Fedora, Debian) |
            | **Linux (Debian/Ubuntu)** | `RDX___VERSION___amd64.deb` | Standard package for Ubuntu / Debian / Linux Mint |
            | **Linux (RPM)** | `RDX-__VERSION__-1.x86_64.rpm` | Package for Fedora / openSUSE / RHEL |
            | **macOS** | `RDX___VERSION___aarch64.dmg` | Disk Image for Apple Silicon Mac (M1/M2/M3/M4) |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
