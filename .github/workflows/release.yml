name: Release RDX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            gstreamer1.0-vaapi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app & create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'RDX v__VERSION__'
          releaseBody: |
            ## RDX v__VERSION__ — Linux AppImage Codecs Fix, Native Host Clock & Playback Hardening

            Cross-platform native desktop streaming client (Linux, Windows, macOS) built with **Rust (Tauri v2)**, **React 19**, **Tailwind CSS v4**, and **HLS.js**, inspired by modern Android TV & Smart TV interfaces with an *Obsidian Crimson* aesthetic.

            ---

            ### 🇺🇦 Що нового у версії __VERSION__:

            - **🎬 Виправлення відтворення відео в Linux AppImage (H.264/AVC Codecs Bundle)**:
              - У збірку Linux AppImage додано повний набір мультимедійних кодеків GStreamer (`gstreamer1.0-libav`, `gst-plugins-bad`, `gst-plugins-ugly`, `vaapi`).
              - Вирішено проблему нескінченного завантаження та буфера `0.0 сек` — усі H.264 MP4 та HLS стріми відтворюються гладко на будь-яких дистрибутивах (Ubuntu, Arch, Fedora, Debian, Mint).

            - **🕒 Точна синхронізація локального часу (Native Clock Sync)**:
              - Годинник верхньої панелі переведено на пряме опитування Rust-бекенду (`chrono::Local`), усуваючи скидання часу в UTC (+00:00) всередині пісочниці WebKitGTK.

            - **📥 Усі можливості версії 1.0.7 збережено та вдосконалено**:
              - Розумне автозникання контролерів міні-плеєра (Mini-Player Autohide).
              - Універсальні клавіатурні шорткати (`F`, `Space`, `M`, `S`, `L`, `I`) незалежно від мовної розкладки.
              - Оверлей діагностики та статистики потоку (`I`).
              - Мультивибір серій та сезонів у завантажувачі.
              - Автооновлення Minisign ED25519.

            ---

            ### 🇬🇧 What's New in v__VERSION__:

            - **🎬 Linux AppImage Video Playback & H.264/AVC Codecs Fix**:
              - Bundled complete GStreamer multimedia codec suite (`gstreamer1.0-libav`, `bad`, `ugly`, `vaapi`) inside the universal Linux AppImage.
              - Fixes infinite loading spinner and `0.0s buffer` stall on Linux — all H.264 MP4 and HLS streams now decode natively across all distributions.

            - **🕒 Native Host Clock Synchronization**:
              - Top navigation TV clock is now synchronized directly via native Rust backend (`chrono::Local`), preventing WebKitGTK sandbox UTC (+00:00) fallback.

            - **📥 Inherited v1.0.7 Capabilities**:
              - Mini-Player smart controls autohide & clean context.
              - Layout-independent physical scancode keyboard shortcuts (`F`, `Space`, `M`, `S`, `L`, `I`).
              - Stream diagnostics overlay (`I`).
              - Batch downloader with multi-episode/season picker.
              - Secure cryptographic Minisign OTA updates.
              - Direct package format switcher (.rpm, .deb, AppImage, .exe, .dmg) in updater modal.
              - Secure cryptographic Minisign ED25519 signed OTA updates.

            ---

            ### 📦 Завантаження та встановлення / Download & Installation

            | Platform | Package | Description |
            | :--- | :--- | :--- |
            | **Windows** | `RDX___VERSION___x64-setup.exe` | Recommended installer for Windows 10 & 11 |
            | **Windows** | `RDX___VERSION___x64_en-US.msi` | Windows Installer package |
            | **Linux (Universal)** | `RDX___VERSION___amd64.AppImage` | Portable binary with bundled GStreamer codecs (Arch, Ubuntu, Fedora, Debian) |
            | **Linux (Debian/Ubuntu)** | `RDX___VERSION___amd64.deb` | Standard package for Ubuntu / Debian / Linux Mint |
            | **Linux (RPM)** | `RDX-__VERSION__-1.x86_64.rpm` | Package for Fedora / openSUSE / RHEL |
            | **macOS** | `RDX___VERSION___aarch64.dmg` | Disk Image for Apple Silicon Mac (M1/M2/M3/M4) |
            | **Windows** | `RDX___VERSION___x64-setup.exe` | Recommended installer for Windows 10 & 11 |
            | **Windows** | `RDX___VERSION___x64_en-US.msi` | Windows Installer package |
            | **Linux (Universal)** | `RDX___VERSION___amd64.AppImage` | Portable binary with bundled GStreamer codecs (Arch, Ubuntu, Fedora, Debian) |
            | **Linux (Debian/Ubuntu)** | `RDX___VERSION___amd64.deb` | Standard package for Ubuntu / Debian / Linux Mint |
            | **Linux (RPM)** | `RDX-__VERSION__-1.x86_64.rpm` | Package for Fedora / openSUSE / RHEL |
            | **macOS** | `RDX___VERSION___aarch64.dmg` | Disk Image for Apple Silicon Mac (M1/M2/M3/M4) |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
