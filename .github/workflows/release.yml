name: Release RDX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            gstreamer1.0-vaapi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app & create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'RDX v__VERSION__'
          releaseBody: |
            ## RDX v__VERSION__ — Smart Tiling WM Controls, Accurate TMDB Matching & Planned Bookmarks

            Cross-platform native desktop streaming client (Linux, Windows, macOS) built with **Rust (Tauri v2)**, **React 19**, **Tailwind CSS v4**, and **HLS.js**, inspired by modern Android TV & Smart TV interfaces with an *Obsidian Crimson* aesthetic.

            ---

            ### 🇺🇦 Що нового у версії __VERSION__:

            - **🪟 Розумні кнопки вікна для Linux / Tiling WM**:
              - Додано автоматичне визначення тайлінгових віконних менеджерів (Hyprland, Sway, i3, bspwm, niri, river тощо) на Linux — кнопки згортання/розгортання/закриття автоматично приховуються там, де вони не потрібні.
              - У налаштуваннях інтерфейсу з'явився вибір режиму кнопок вікна (**Авто** / **Завжди** / **Приховати**).

            - **🎯 Точний підбір фонів TMDB**:
              - Покращено алгоритм зіставлення назви та року в TMDB: результати з невідповідним роком (відмінність >= 2 років) або чужими франшизами тепер відсіюються, щоб замість хибного фону показувався рідний постер тайтла.

            - **📌 Виправлено вкладку закладок «В планах»**:
              - Непереглянуті фільми та серіали при додаванні в закладки тепер потрапляють у **«В планах»**, а після початку перегляду автоматично переходять у **«Дивлюсь»** та **«Переглянуто»**.

            ---

            ### 🇬🇧 What's New in v__VERSION__:

            - **🪟 Smart Window Controls for Linux / Tiling WMs**:
              - Added automatic tiling WM detection on Linux (Hyprland, Sway, i3, bspwm, niri, river, etc.) so custom window buttons hide automatically when running in a tiling environment.
              - Added a **Window Controls** preference (**Auto** / **Always** / **Hide**) in Appearance settings.

            - **🎯 Accurate TMDB Backdrop Matching**:
              - Tightened TMDB title similarity scoring and year filtering (rejecting >= 2 year mismatches and unrelated franchises) so cards fall back to their own poster rather than showing an unrelated title's backdrop.

            - **📌 Fixed "Planned" Bookmarks Workflow**:
              - Unwatched titles added to bookmarks now land in **Planned** («В планах») and automatically transition to **Watching** («Дивлюсь») and **Completed** («Переглянуто») as playback progresses.

            ---

            ### 📦 Завантаження та встановлення / Download & Installation

            | Platform | Package | Description |
            | :--- | :--- | :--- |
            | **Windows** | `RDX___VERSION___x64-setup.exe` | Recommended installer for Windows 10 & 11 |
            | **Windows** | `RDX___VERSION___x64_en-US.msi` | Windows Installer package |
            | **Linux (Universal)** | `RDX___VERSION___amd64.AppImage` | Portable binary with bundled GStreamer codecs (Arch, Ubuntu, Fedora, Debian) |
            | **Linux (Debian/Ubuntu)** | `RDX___VERSION___amd64.deb` | Standard package for Ubuntu / Debian / Linux Mint |
            | **Linux (RPM)** | `RDX-__VERSION__-1.x86_64.rpm` | Package for Fedora / openSUSE / RHEL |
            | **macOS** | `RDX___VERSION___aarch64.dmg` | Disk Image for Apple Silicon Mac (M1/M2/M3/M4) |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
