name: Release RDX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app & create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'RDX v__VERSION__'
          releaseBody: |
            ## RDX v__VERSION__ — Mini-Player Autohide, Universal Shortcuts & Glassmorphism Stats

            Cross-platform native desktop streaming client (Linux, Windows, macOS) built with **Rust (Tauri v2)**, **React 19**, **Tailwind CSS v4**, and **HLS.js**, inspired by modern Android TV & Smart TV interfaces with an *Obsidian Crimson* aesthetic.

            ---

            ### 🇺🇦 Що нового у версії __VERSION__:

            - **📺 Покращення міні-плеєра (Mini-Player Autohide & Clean Context)**:
              - **Автозникання кнопок:** додано миттєве приховування контролерів керування при відведенні миші за межі міні-вікна та 2.5-секундний таймер неактивності курсора під час відтворення.
              - **Чистий контекст:** вимкнено громіздке повноекранне контекстне меню плеєра по правому кліку (ПКМ) у режимі міні-плеєра (PiP / docked), щоб меню більше не перекривало відео.

            - **⌨️ Універсальні гарячі клавіші (Universal Shortcuts)**:
              - Шорткати переведено на фізичні сканкоди клавіш (`e.code`): `F` (повний екран), `Space` / `K` (пауза), `M` (звук), `S` (скриншот), `L` (повтор відрізка A-B), `I` (статистика потоку) тепер стабільно працюють **як на українській, так і на англійській розкладці клавіатури**.

            - **📊 Оновлений оверлей статистики потоку (`I`)**:
              - Збільшено ширину віконця до 380px для запобігання переносу тексту в рядках Turbo-буфера (Multi-segment) та CDN.
              - Застосовано стильний напівпрозорий скляний фон із розмиттям (`bg-zinc-950/80 backdrop-blur-xl border border-white/10`).

            - **✨ Виправлення інтерфейсу та стабільності (UI Polish & Stability)**:
              - **Картки продовження перегляду:** вирівняно таймлайни та мітки озвучки в акуратний підпис під постером, а прогрес-бар закріплено на нижньому краї постера.
              - **Модальне вікно оновлень:** оптимізовано рендеринг списку змін та стабільність діалогу ОТА.

            - **📥 Усі можливості версії 1.0.6 збережено та вдосконалено**:
              - Гнучкий вибір серій та сезонів у завантажувачі.
              - Інтерактивний вибір формату пакета (.rpm, .deb, AppImage, .exe, .dmg) у вікні оновлень.
              - Криптографічний підпис оновлень Minisign ED25519.

            ---

            ### 🇬🇧 What's New in v__VERSION__:

            - **📺 Mini-Player Experience Improvements**:
              - **Smart Autohide:** Instant hiding of playback controls upon mouse leaving the mini-player window, with a 2.5s inactivity fade-out while playing.
              - **Clean Context:** Disabled heavy full-player right-click context menu in mini-player mode (PiP / docked) to keep the video unobstructed.

            - **⌨️ Universal Layout-Independent Keyboard Shortcuts**:
              - Upgraded all player hotkeys to physical key scancodes (`e.code`): `F` (Fullscreen), `Space` / `K` (Play/Pause), `M` (Mute), `S` (Screenshot), `L` (A-B Loop), `I` (Stats overlay) now work seamlessly across Ukrainian, English, and any international keyboard layout.

            - **📊 Polished Stream Diagnostics Overlay (`I`)**:
              - Widened statistics overlay to 380px to eliminate awkward text line-breaks in Turbo-buffer (Multi-segment) and CDN rows.
              - Modernized with a sleek translucent dark glassmorphism aesthetic (`backdrop-blur-xl`).

            - **✨ UI Polish & Stability**:
              - **Continue Watching Cards:** Harmonized timeline and translation metadata underneath posters with a clean bottom-edge progress bar.
              - **Update Modal:** Fortified changelog rendering and hook lifecycle in OTA dialog.

            - **📥 Inherited v1.0.6 Capabilities**:
              - Custom multi-episode & multi-season selection downloader.
              - Direct package format switcher (.rpm, .deb, AppImage, .exe, .dmg) in updater modal.
              - Secure cryptographic Minisign ED25519 signed OTA updates.

            ---

            ### 📦 Завантаження та встановлення / Download & Installation

            | Platform | Package | Description |
            | :--- | :--- | :--- |
            | **Windows** | `RDX___VERSION___x64-setup.exe` | Recommended installer for Windows 10 & 11 |
            | **Windows** | `RDX___VERSION___x64_en-US.msi` | Windows Installer package |
            | **Linux (Universal)** | `RDX___VERSION___amd64.AppImage` | Portable binary with bundled GStreamer codecs (Arch, Ubuntu, Fedora, Debian) |
            | **Linux (Debian/Ubuntu)** | `RDX___VERSION___amd64.deb` | Standard package for Ubuntu / Debian / Linux Mint |
            | **Linux (RPM)** | `RDX-__VERSION__-1.x86_64.rpm` | Package for Fedora / openSUSE / RHEL |
            | **macOS** | `RDX___VERSION___aarch64.dmg` | Disk Image for Apple Silicon Mac (M1/M2/M3/M4) |
            | **Windows** | `RDX___VERSION___x64-setup.exe` | Recommended installer for Windows 10 & 11 |
            | **Windows** | `RDX___VERSION___x64_en-US.msi` | Windows Installer package |
            | **Linux (Universal)** | `RDX___VERSION___amd64.AppImage` | Portable binary with bundled GStreamer codecs (Arch, Ubuntu, Fedora, Debian) |
            | **Linux (Debian/Ubuntu)** | `RDX___VERSION___amd64.deb` | Standard package for Ubuntu / Debian / Linux Mint |
            | **Linux (RPM)** | `RDX-__VERSION__-1.x86_64.rpm` | Package for Fedora / openSUSE / RHEL |
            | **macOS** | `RDX___VERSION___aarch64.dmg` | Disk Image for Apple Silicon Mac (M1/M2/M3/M4) |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
